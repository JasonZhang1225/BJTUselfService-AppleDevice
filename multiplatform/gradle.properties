org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official

# Compose 1.12 alpha/beta 的 AAR 元数据要求 compileSdk 37，本机 SDK 最高 android-36.1；
# AGP 9.1 用该开关跳过此检查（旧 android.suppressUnsupportedCompileSdk 已失效），
# 不改 compileSdk/targetSdk。
android.experimental.disableCompileSdkChecks=true
