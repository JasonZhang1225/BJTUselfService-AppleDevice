name: KMP package

on:
  push:
    tags:
      - "v*-KMP*"
  workflow_dispatch:

concurrency:
  group: kmp-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Rename APK
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          APK="$(find androidApp/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$VERSION"
          test -f "$APK"
          NAME="BJTUSelfService-KMP-${VERSION}-debug.apk"
          cp "$APK" "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kmp-android-apk
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  windows:
    name: Windows MSI
    runs-on: windows-latest
    defaults:
      run:
        working-directory: multiplatform
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check jpackage
        env:
          WINDOWS_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          $jp = Join-Path $env:JAVA_HOME "bin\jpackage.exe"
          if (-not (Test-Path $jp)) { throw "jpackage missing: $jp" }
          Write-Host "jpackage=$jp"
          & $jp --version
          chcp 65001 | Out-Null

      - name: Build MSI
        env:
          WINDOWS_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
          WINDOWS_PACKAGE_NAME: BJTUselfServiceKMP
          WINDOWS_PACKAGE_DESCRIPTION: BJTU Self Service KMP
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
        run: .\gradlew.bat :windowsApp:packageMsi --stacktrace

      - name: Print jpackage logs
        if: failure()
        run: |
          Get-ChildItem -Recurse "windowsApp\build\compose\logs","windowsApp\build\jpackage-shim" -Include *.txt,*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue
          }

      - name: Rename MSI
        id: artifact
        run: |
          $version = (Select-String -Path "shared\src\commonMain\kotlin\team\bjtuss\bjtuselfservice\shared\update\AppUpdateChecker.kt" -Pattern 'CURRENT_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $msi = Get-ChildItem "windowsApp\build\compose\binaries\main\msi\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          $name = "BJTUselfServiceKMP-$version.msi"
          Copy-Item $msi.FullName $name
          "file=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $name | Format-List Name, Length, LastWriteTime

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: kmp-windows-msi
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: multiplatform
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build macOS DMG
        env:
          DESKTOP_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x ./gradlew
          ./gradlew :desktopApp:packageDmg --stacktrace

      - name: Rename DMG
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          DMG="$(find desktopApp/build/compose/binaries/main/dmg -name '*.dmg' | head -n 1)"
          test -n "$VERSION"
          test -f "$DMG"
          NAME="BJTUselfServiceKMP-${VERSION}.dmg"
          cp "$DMG" "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: kmp-macos-dmg
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    # Compose 1.12 链接 UIViewLayoutRegion，需要 iOS 26 SDK / Xcode 26。
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: multiplatform
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned iOS app
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x ./gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          APP="$(find iosApp/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$VERSION"
          test -d "$APP"
          NAME="BJTUSelfService-KMP-${VERSION}-iOS-unsigned.ipa"
          rm -rf ipa-stage
          mkdir -p ipa-stage/Payload
          cp -R "$APP" ipa-stage/Payload/
          (cd ipa-stage && zip -qry "../$NAME" Payload)
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kmp-ios-ipa
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [android, windows, macos, ios]
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') && (needs.android.result == 'success' || needs.windows.result == 'success' || needs.macos.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kmp-*
          merge-multiple: true
          path: dist

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}：KMP 四端构建
          prerelease: true
          fail_on_unmatched_files: false
          files: dist/*
          body: |
            ### 本版更新

            - 新增物理在线：复用 App 内 CAS/Moodle 会话读取课程、作业安排、提交状态、批改信息、评语和已提交文件。
            - 物理在线作业的开放/截止时间进入首页安排；恰好在次日 `00:00` 截止的作业，首页按前一天标记截止。
            - 物理在线增加按学号隔离的本地缓存。校园网或认证不可达时继续显示只读缓存，并明确显示“同步失败·正显示缓存”、失败原因和缓存创建时间。
            - 首页部分同步失败可查看失败模块并主动重试；首页刷新、失败重试和进入物理在线页不会重复触发同一轮自动同步，打开/退出作业详情也不会清掉失败状态。
            - 移动端物理在线作业详情改为原生二级页面，桌面端保留底部详情弹窗；窄屏布局增加自适应边距和安排控件换行。
            - 保留 1.7.3-KMP-B 的教学周 `getTimeList.weekCode` 优先与作业解析容错，并统一版本标识为 `1.7.4-KMP`。

            ### 安装说明

            | 文件 | 说明 |
            | --- | --- |
            | `BJTUSelfService-KMP-*-debug.apk` | Android debug，包名 `team.bjtuss.bjtuselfservice.kmp` |
            | `BJTUSelfService-KMP-*-iOS-unsigned.ipa` | iOS 未签名，需侧载自签 |
            | `BJTUselfServiceKMP-*.dmg` | macOS Apple Silicon |
            | `BJTUselfServiceKMP-*.msi` | Windows x64 系统级安装 |

            Windows 覆盖安装：先完全退出应用，不要先卸载（卸载会清登录）。若安装器只出现「修复/卸载」，请用：

            `msiexec /i 文件名.msi REINSTALL=ALL REINSTALLMODE=vomus`

            ### 已知限制

            - 非正式商店签名 / 未公证；iOS unsigned IPA 需自行签名侧载；Mac 版可能需执行 `sudo xattr -r -d com.apple.quarantine /Applications/交大自由行 KMP.app`
            - 物理在线的自动同步依赖校园网，离开校园网时只能读取已有缓存；真实文件提交仍需在可编辑作业上继续验收。
            - 小组件、系统通知等仍延后
            - Windows MSI 使用 `1.7.4` 产品版本并沿用升级码；建议直接运行 MSI 覆盖升级，不要先卸载。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
